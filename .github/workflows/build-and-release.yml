name: Build and Release

on:
  push:
    branches: [ master, develop, github-release ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, develop ]
  # Manual run: exercises security/test/build-cli/build-gui without publishing
  # (the release job only runs for v* tags), which is how the pipeline is
  # validated before a release tag is pushed.
  workflow_dispatch:

# A newer push to the same branch or PR cancels the build still running for the
# older one, so only the latest commit builds. Tag runs are never cancelled:
# they publish the release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # Check for outdated dependencies (informational only)
  check-deps:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Check for available updates
        working-directory: gui
        env:
          GOWORK: off
        run: |
          echo "📦 Current dependencies and available updates:"
          echo "================================================"
          go list -u -m all | grep '\[' || echo "✅ All dependencies are up to date!"
          echo ""
          echo "Legend: module current-version [latest-version]"
          echo "No brackets = already at latest version"

  # Security and quality checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Install dependencies
        working-directory: gui
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Tidy dependencies
        working-directory: gui
        env:
          GOWORK: off
        run: go mod tidy

      - name: Run gosec
        env:
          GOWORK: off
        run: |
          # Pinned: gosec adds rules between releases (v2.30 brought the G703
          # path-traversal taint analysis), and an unpinned scanner turning a
          # previously green release red is exactly what happened here. Bump
          # deliberately, in a PR, not implicitly at release time.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          cd gui && gosec -severity high -confidence high ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: gui
          args: --timeout=5m
        env:
          GOWORK: off

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Install dependencies
        working-directory: gui
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Tidy dependencies
        working-directory: gui
        env:
          GOWORK: off
        run: go mod tidy

      - name: Run tests
        working-directory: gui
        env:
          GOWORK: off
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage
        working-directory: gui
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./gui/coverage.out

  # Run the unit tests that live OUTSIDE the gui module (pbscommon, pkg/*, snapshot).
  # The "test" job above only covers gui/; these modules previously had zero CI
  # coverage despite shipping the chunker, catalog/didx readers, retry logic and
  # VSS helpers. Matrixed so Windows-only code (snapshot) is exercised too. [audit Q-9]
  test-modules:
    name: Test non-GUI modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Informational for now: this job surfaced that some library modules aren't
    # self-contained under GOWORK=off. It must NOT block builds/release until the
    # underlying module test is green, so it is not in any job's `needs` and is
    # allowed to fail. Re-enable gating once it passes. [Q-9]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Test cross-platform modules
        shell: bash
        env:
          GOWORK: off
        run: |
          rc=0
          # gui/api is its own module, so the gui job's ./... leaves it out.
          for m in pbscommon pkg/retry pkg/security gui/api tui; do
            echo "::group::go test $m"
            # go mod tidy first: these library modules are normally built via the
            # workspace / replace directives, so their own go.mod/go.sum can lack
            # imports (e.g. pbscommon -> cornelk/hashmap) that a GOWORK=off build
            # needs. Mirrors the gui "test" job.
            if ( cd "$m" && go mod tidy && go test ./... ); then
              echo "RESULT $m: PASS"
            else
              echo "RESULT $m: FAIL (see above)"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Test Windows-only modules
        if: runner.os == 'Windows'
        shell: bash
        env:
          GOWORK: off
        run: |
          set -e
          echo "::group::go test snapshot"
          ( cd snapshot && go mod tidy && go test ./... )
          echo "::endgroup::"

  # Build CLI for all platforms
  build-cli:
    name: Build CLI
    needs: [security, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Build CLI
        env:
          GOWORK: off
        run: make cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ runner.os }}
          path: dist/salvanza-cli*

  # Build GUI (Windows only for now)
  build-gui:
    name: Build GUI
    needs: [security, test]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        # Pinned to v2.12.0 — the exact version @latest resolved to in the
        # green v0.2.106 build, so we ship identical bytes while keeping a
        # DETERMINISTIC build toolchain (the CLI orchestrates frontend bundling
        # + asset embedding before `go build`, so a floating CLI would make
        # even the .exe non-reproducible). Do NOT pin to the library version in
        # gui/go.mod (v2.8.0): that CLI tag fails to build under Go 1.25.
        # Bumping the library to match is a separate, tested task.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Frontend Dependencies
        working-directory: gui/frontend
        run: npm install

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # When the build is triggered by a tag push (v*), the tag is
          # the source of truth. For branch pushes / PRs we fall back to
          # wails.json + short SHA so dev builds get a sensible,
          # non-overlapping version string.
          #
          # VERSION feeds main.appVersion via ldflags (displayed in the
          # GUI, logged in each run banner). VERSION_MSI feeds the WiX
          # ProductVersion and the service .syso, both of which must be a
          # strict numeric x.y.z tuple:
          #   - dev builds strip the -dev-<sha> suffix;
          #   - prerelease tags (v1.2.0-rc.1) strip the -rc.1 suffix, so the
          #     MSI reports 1.2.0 instead of failing candle.exe with an
          #     invalid ProductVersion. The binaries keep the full version.
          $base = (Get-Content gui/wails.json | ConvertFrom-Json).info.productVersion
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "$base-dev-$shortSha"
          }
          $version_msi = ($version -split '[-+]')[0]
          if ($version_msi -notmatch '^\d+\.\d+\.\d+$') {
            $version_msi = ($base -split '[-+]')[0]
          }
          if ($version_msi -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$version_msi' is not a numeric x.y.z version; WiX/versioninfo would reject it"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION_MSI=$version_msi" >> $env:GITHUB_OUTPUT
          echo "Building version: $version (MSI: $version_msi)"

      - name: Build GUI
        working-directory: gui
        env:
          GOWORK: off
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.appVersion=${{ steps.version.outputs.VERSION }}"

      # The service is a plain `go build` from gui/ and would otherwise ship
      # with no Windows version info — a strong heuristic/ML false-positive
      # signal (Codex review). Generate a .syso with proper CompanyName /
      # ProductName / version so salvanza-svc.exe looks like normal signed-
      # vendor software. Must run AFTER the Wails GUI build (same package dir):
      # we strip any leftover .syso first so the GUI's resource can't leak into
      # the service link and cause a duplicate-resource error.
      - name: Generate service version resource
        working-directory: gui
        shell: pwsh
        run: |
          Remove-Item *.syso -ErrorAction SilentlyContinue
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
          $ver = "${{ steps.version.outputs.VERSION }}"
          $p = "${{ steps.version.outputs.VERSION_MSI }}" -split '\.'
          $json = @"
          {
            "FixedFileInfo": {
              "FileVersion":    { "Major": $($p[0]), "Minor": $($p[1]), "Patch": $($p[2]), "Build": 0 },
              "ProductVersion": { "Major": $($p[0]), "Minor": $($p[1]), "Patch": $($p[2]), "Build": 0 }
            },
            "StringFileInfo": {
              "CompanyName": "Salvanza",
              "FileDescription": "Salvanza for Proxmox Backup Server Service",
              "FileVersion": "$ver",
              "InternalName": "salvanza-svc",
              "LegalCopyright": "Copyright (c) 2024-2026 Salvanza contributors",
              "OriginalFilename": "salvanza-svc.exe",
              "ProductName": "Salvanza for Proxmox Backup Server",
              "ProductVersion": "$ver"
            },
            "VarFileInfo": { "Translation": { "LangID": "0409", "CharsetID": "04B0" } }
          }
          "@
          $json | Out-File -Encoding utf8 versioninfo.json
          $gobin = (go env GOPATH) + "\bin\goversioninfo.exe"
          & $gobin -64 -o servicewinres.syso versioninfo.json

      - name: Build Service
        working-directory: gui
        env:
          GOWORK: off
        run: |
          go build -tags service -trimpath -buildmode=pie -ldflags "-s -w -X main.appVersion=${{ steps.version.outputs.VERSION }}" -o build/bin/salvanza-svc.exe
        shell: pwsh

      # The command line, salvanza-cli.exe, ships in every MSI next to the
      # app (installer/wix/ProductBody.wxi, CommandLine component).
      - name: Build command line
        working-directory: cli
        env:
          GOWORK: off
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o ../gui/build/bin/salvanza-cli.exe .
        shell: pwsh

      - name: Prepare dist directory
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
        shell: pwsh

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.14\bin"
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # One MSI per brand, version-stamped. The GUI picks its identity from the
      # executable name (gui/brand.go), so ProductBody.wxi packages the same
      # binaries under <ExeName>.exe / <ServiceExeName>.exe; staging them per
      # brand is what makes "NimbusBackup.msi" install Nimbus Backup. The
      # command line (salvanza-cli.exe) is the same in every brand.
      # Brand list and naming mirror installer/wix/build_msi_linux.sh and
      # scripts/build-signpath.ps1. Only the MSIs are published: the release
      # ships no stand-alone .exe.
      - name: Build MSI installers (one per brand)
        working-directory: installer/wix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ProductVersion must be numeric (WiX), but the FILE name carries the
          # real release version, so testers can tell 1.2.0-rc.1 from 1.2.0.
          $version = "${{ steps.version.outputs.VERSION_MSI }}"
          $fileVersion = "${{ steps.version.outputs.VERSION }}"
          # MSI name = exe base: the wxs file, and <base>-gui.exe / <base>-svc.exe.
          $brands = [ordered]@{ 'Salvanza' = 'salvanza'; 'NimbusBackup' = 'nimbusbackup'; 'EtitechBackup' = 'etitechbackup' }
          $bin = (Resolve-Path '../../gui/build/bin').Path
          $dist = (Resolve-Path '../../dist').Path

          foreach ($brand in $brands.Keys) {
            $base = $brands[$brand]
            # The default brand ships as the generic Product.wxs.
            $wxs = if ($brand -eq 'Salvanza') { 'Product.wxs' } else { "$brand.wxs" }
            if (-not (Test-Path $wxs)) { throw "missing WiX source for brand ${brand}: $wxs" }
            if (-not (Test-Path "../../installer/icons/$base-gui.ico")) { throw "missing icon for brand ${brand}" }

            foreach ($pair in @(
                @((Join-Path $bin 'salvanza-gui.exe'), (Join-Path $bin "$base-gui.exe")),
                @((Join-Path $bin 'salvanza-svc.exe'), (Join-Path $bin "$base-svc.exe"))
            )) {
                # The default brand's name IS the build output name; copying a
                # file onto itself is an error even with -Force.
                if ($pair[0] -ne $pair[1]) { Copy-Item $pair[0] $pair[1] -Force }
            }

            candle.exe "-dProductVersion=$version" $wxs -ext WixUIExtension -ext WixUtilExtension -out "$brand.wixobj"
            if ($LASTEXITCODE -ne 0) { throw "candle failed for $brand (exit $LASTEXITCODE)" }
            light.exe "$brand.wixobj" -ext WixUIExtension -ext WixUtilExtension -sval -out (Join-Path $dist "$brand-$fileVersion-x64.msi")
            if ($LASTEXITCODE -ne 0) { throw "light failed for $brand (exit $LASTEXITCODE)" }
            Write-Host "==> $brand-$fileVersion-x64.msi"
          }

          Get-ChildItem $dist -Filter *.msi | Format-Table Name, Length

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
           name: Salvanza-Windows
           path: dist/*.msi

  # Linux packages (app, service and command line): the .deb and .rpm for
  # amd64 and arm64, and the Arch package for x86_64. Each is built in its
  # standard container (ubuntu:22.04, fedora:44, archlinux) by
  # packaging/build-linux-package.sh, the same script a developer runs
  # locally, so a local build and this one are made the same way. arm64
  # builds natively on GitHub's arm64 runners (free for public repositories).
  # There is no official Arch Linux arm64 image, hence no aarch64 Arch package.
  build-linux:
    name: Linux ${{ matrix.kind }} (${{ matrix.arch }})
    needs: [security, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: deb,  arch: amd64, runner: ubuntu-24.04 }
          - { kind: deb,  arch: arm64, runner: ubuntu-24.04-arm }
          - { kind: rpm,  arch: amd64, runner: ubuntu-24.04 }
          - { kind: rpm,  arch: arm64, runner: ubuntu-24.04-arm }
          - { kind: arch, arch: amd64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        env:
          PBS_ARCH: ${{ matrix.arch }}
        run: |
          # A tag gives the version (v2.0.0-rc.1 -> 2.0.0~rc.1, which sorts
          # before 2.0.0); a branch build is <productVersion>~dev.<sha>.
          if [ "${{ github.ref_type }}" = tag ]; then
            PBS_VERSION=$(echo "${GITHUB_REF_NAME#v}" | tr '-' '~')
            export PBS_VERSION
          fi
          sh packaging/build-linux-package.sh ${{ matrix.kind }} dist
          ls -l dist

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.kind }}-${{ matrix.arch }}
          path: dist/*

  # Create release on tag
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, build-gui, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # mint the Sigstore OIDC token for attestation
      attestations: write  # store the build-provenance attestation

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe`/`git log PREV_TAG..HEAD` in
          # the release-notes step can compute the previous tag and list the
          # commits since it. A shallow (depth-1) checkout has no prior tags,
          # which left the "What's in this release" section empty.
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release archives
        run: |
          mkdir -p release

          # CLI Windows
          cd artifacts/cli-Windows && zip ../../release/salvanza-cli-${{ steps.version.outputs.VERSION }}-windows.zip *
          cd ../..

          # CLI Linux
          cd artifacts/cli-Linux && tar -czf ../../release/salvanza-cli-${{ steps.version.outputs.VERSION }}-linux.tar.gz *
          cd ../..

          # CLI macOS
          cd artifacts/cli-macOS && tar -czf ../../release/salvanza-cli-${{ steps.version.outputs.VERSION }}-macos.tar.gz *
          cd ../..

          # GUI Windows - one version-stamped MSI per brand, and nothing else:
          # the release ships no stand-alone .exe (the MSI installs it under
          # the brand name the GUI resolves at runtime).
          cd artifacts/Salvanza-Windows
          cp *.msi ../../release/
          cd ../..

          # Linux packages: .deb and .rpm (amd64, arm64), Arch (x86_64).
          cp artifacts/linux-*/* release/

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Free, OSS-friendly cryptographic provenance: attests that these exact
      # binaries were produced by THIS workflow, from THIS commit. Verifiable
      # with `gh attestation verify <file> --repo salvanza/salvanza_client`.
      # A strong trust signal for a sysadmin audience while signing is pending.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.msi
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/*.zip
            release/*.tar.gz

      # Best-effort: submit the Windows binaries to VirusTotal so the release
      # page can link a live multi-engine report (transparency while the
      # Authenticode certificate is pending). Skips cleanly if the secret is
      # absent and never fails the release. The GUI report URL is just the
      # file's SHA-256. We GATE the link on a clean result: a fresh hash can
      # show transient heuristic hits, and we must not publish a link to a
      # "2/70 detected" report as if it were proof of safety — so we poll the
      # analysis and only emit the link when malicious+suspicious == 0.
      - name: Submit to VirusTotal (best-effort, gated on 0 detections)
        continue-on-error: true
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VT_KEY" ]; then
            echo "VIRUSTOTAL_API_KEY not set — skipping VirusTotal submission."
            exit 0
          fi
          : > vt-section.md
          emitted=0
          VER="${{ steps.version.outputs.VERSION }}"
          # Every branded MSI in this release (the .exe is no longer published).
           for f in release/*-${VER}-x64.msi; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            # Free public API: files must be <32MB (ours are); 4 req/min limit.
            resp=$(curl -sS --max-time 180 -X POST https://www.virustotal.com/api/v3/files \
              -H "x-apikey: $VT_KEY" --form file=@"$f" || true)
            aid=$(jq -r '.data.id // empty' <<<"$resp" 2>/dev/null || true)
            if [ -z "$aid" ]; then
              echo "WARN: VirusTotal submission failed for $name — omitting link."
              sleep 20; continue
            fi
            status=""; mal=0; susp=0
            for _ in $(seq 1 10); do
              sleep 20
              ar=$(curl -sS --max-time 60 -H "x-apikey: $VT_KEY" "https://www.virustotal.com/api/v3/analyses/$aid" || true)
              status=$(jq -r '.data.attributes.status // empty' <<<"$ar" 2>/dev/null || true)
              if [ "$status" = "completed" ]; then
                mal=$(jq  -r '(.data.attributes.stats.malicious  // 0) | tonumber? // 0' <<<"$ar" 2>/dev/null || echo 0)
                susp=$(jq -r '(.data.attributes.stats.suspicious // 0) | tonumber? // 0' <<<"$ar" 2>/dev/null || echo 0)
                break
              fi
            done
            if [ "$status" != "completed" ]; then
              echo "WARN: VirusTotal analysis not completed in time for $name — omitting link."
              continue
            fi
            if [ "$((mal + susp))" -gt 0 ]; then
              echo "WARN: VirusTotal reports $mal malicious / $susp suspicious for $name ($sha) — omitting link to avoid publishing a non-clean report."
              continue
            fi
            if [ "$emitted" -eq 0 ]; then
              { echo ""; echo "### 🛡️ VirusTotal reports — 0 detections"; echo ""; } >> vt-section.md
              emitted=1
            fi
            echo "- [\`$name\`](https://www.virustotal.com/gui/file/$sha) — clean" >> vt-section.md
          done
          if [ -s vt-section.md ]; then cat vt-section.md; else echo "No clean VirusTotal links to publish."; fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Create release notes from RELEASE_NOTES.md + recent commits
          cat > RELEASE_BODY.md << 'EOFNOTES'
           # 🚀 Salvanza for Proxmox Backup Server ${{ steps.version.outputs.VERSION }}

           > ⚠️ **Windows flagged the download as a virus?** This is a known false positive (unsigned Go/Wails binaries inside the installer), *not* a virus. See the [project repository](https://github.com/salvanza/salvanza_client) for how to verify the download. A code-signing certificate (SignPath Foundation) is on the way.

          ## 📦 Downloads

          One Windows installer (`.msi`) per brand; no stand-alone `.exe` is
          published. Pick the brand you are licensed for; they are the same
          build, and the installed application takes its identity from its
          executable name.

          | File | Brand |
          |---|---|
          | `Salvanza-<version>-x64.msi` | Salvanza for Proxmox Backup Server (default) |
          | `NimbusBackup-<version>-x64.msi` | Nimbus Backup |
          | `EtitechBackup-<version>-x64.msi` | Etitech Backup |

          Each installer replaces an earlier Proxmox Backup Client install or
          another brand, and moves its settings over.

          Linux packages (the app, the background service and the command
          line), for x86-64 (`amd64`, `x86_64`) and ARM 64-bit (`arm64`,
          `aarch64`):

          | File | For |
          |---|---|
          | `salvanza_<version>_amd64.deb`, `salvanza_<version>_arm64.deb` | Debian 12+, Ubuntu 22.04+, Linux Mint 21+ |
          | `salvanza-<version>-1.fc44.x86_64.rpm`, `...aarch64.rpm` | Fedora |
          | `salvanza-<version>-1-x86_64.pkg.tar.zst` | Arch Linux, Manjaro, EndeavourOS |

          The command line, `salvanza-cli`, is in every installer and package
          and in the per-platform archives (`salvanza-cli-*` and
          `salvanza_client_*`).

          ## 📝 What's in this release

          EOFNOTES

          # What changed: CHANGELOG.md, and the full comparison with the
          # previous tag. Not the commit titles themselves: 2.0.0 had ~750 since
          # its prerelease, which buried the rest of the page.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "Every change is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.VERSION }}/CHANGELOG.md)."
            if [ -n "$PREV_TAG" ]; then
              echo "All commits since ${PREV_TAG}: [${PREV_TAG}...${{ steps.version.outputs.VERSION }}](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.VERSION }})."
            fi
          } >> RELEASE_BODY.md

          # Publish the SHA-256 checksums on the release page itself so users
          # can verify integrity without downloading SHA256SUMS.txt first.
          echo "" >> RELEASE_BODY.md
          echo "### 🔐 SHA-256 checksums" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "Verify with \`Get-FileHash <file> -Algorithm SHA256\` (PowerShell) or \`sha256sum -c SHA256SUMS.txt\`." >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo '```' >> RELEASE_BODY.md
          cat release/SHA256SUMS.txt >> RELEASE_BODY.md
          echo '```' >> RELEASE_BODY.md

          # VirusTotal links (produced by the best-effort step above, if any)
          if [ -f vt-section.md ]; then
            cat vt-section.md >> RELEASE_BODY.md
          fi

          # Add full status from RELEASE_NOTES.md
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          cat RELEASE_NOTES.md >> RELEASE_BODY.md

          # Add tested with section
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
           echo "### Tested with Proxmox Backup Server" >> RELEASE_BODY.md
           echo "" >> RELEASE_BODY.md
           echo "This release has been tested against Proxmox Backup Server: see the [project repository](https://github.com/salvanza/salvanza_client)." >> RELEASE_BODY.md

          # Add links at the end (FR bare URL + EN /en/ variant)
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
           echo "**Salvanza**: [salvanza.org](https://salvanza.org/) · [GitHub](https://github.com/salvanza/salvanza_client) · [Forum](https://forum.proxmox.com/)" >> RELEASE_BODY.md
           echo "" >> RELEASE_BODY.md
           echo "**Salvanza**: [Releases](https://github.com/salvanza/salvanza_client/releases)" >> RELEASE_BODY.md

          # A release page keeps every line break, so the template's and the
          # notes' wrapped paragraphs would show as a narrow column: join them.
          python3 scripts/unwrap-markdown.py RELEASE_BODY.md

      # Release notes written by hand on the release page (before this job
      # finishes) are kept: the job then only adds its files. goreleaser leaves
      # the text empty (.goreleaser.yaml: changelog disabled), so an empty text
      # means nobody wrote one, and the generated notes above are used.
      - name: Is there hand-written release text?
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh release view "${{ steps.version.outputs.VERSION }}" --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null || true)
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "keep=true" >> "$GITHUB_OUTPUT"
            echo "The release already has text ($(printf '%s' "$body" | wc -c) bytes): keeping it, adding the files only."
          else
            echo "keep=false" >> "$GITHUB_OUTPUT"
          fi

      # The goreleaser workflow ("Release Automation") normally creates the
      # release for this tag a few minutes earlier, with the cross-platform CLI
      # archives. These steps then update that release: they add the MSIs, the
      # Linux packages and the CLI bundles built above, and set the text only
      # when nobody has written it. action-gh-release edits an existing release
      # for the tag rather than failing, which is what makes the two workflows
      # coexist; without a body input it leaves the text as it is.
      - name: Create GitHub Release
        if: steps.existing.outputs.keep != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: release/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gh release upload adds files and never touches the text.
      - name: Add the files to the release (its text is kept)
        if: steps.existing.outputs.keep == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.VERSION }}" release/* --repo "${{ github.repository }}" --clobber

      - name: Update latest release badge
        if: ${{ !contains(steps.version.outputs.VERSION, '-') }}
        run: |
          echo "Latest stable release: ${{ steps.version.outputs.VERSION }}"
