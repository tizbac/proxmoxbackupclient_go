# Adapted from: https://github.com/safedep/vet/blob/main/.github/workflows/goreleaser.yml
name: Release Automation

on:
  push:
    tags:
      - "*" # triggers when pushing a new tag like `0.8.4`

concurrency: ci-release-automation

permissions:
  contents: read

jobs:
  goreleaser:
    timeout-minutes: 30
    permissions:
      contents: write      # create the GitHub release
      packages: write      # publish docker images (if configured in goreleaser)
      id-token: write      # mint the Sigstore OIDC token for attestation
      attestations: write  # store the build-provenance attestation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: machinebackup/go.mod #We have two go.mod but either one gonna be sort of ok
          check-latest: true

      - name: Log in to GHCR
        if: contains(github.repository, 'ghcr.io')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          # Pinned to the v2 major: the config (.goreleaser.yaml) is schema v2,
          # which goreleaser < v2.19 accepted but newer majors change again.
          # Floating "latest" is what silently broke the release pipeline.
          version: "~> v2.19"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub-native provenance for the goreleaser archives. This replaces the
      # external SLSA generator workflow (slsa-github-generator@v1.4.0), whose
      # reusable workflow has been failing since v1.1.3 and which only attested
      # checksums.txt rather than the files users download. Verify with
      # `gh attestation verify <file> --repo tizbac/proxmoxbackupclient_go`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
