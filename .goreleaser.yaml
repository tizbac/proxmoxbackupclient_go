# GoReleaser configuration for the cross-platform CLI archives.
#
# The Windows GUI + service MSIs are *not* built here: they come from
# .github/workflows/build-and-release.yml, which uploads them to the same
# GitHub release this file creates for the tag.
#
# One program, salvanza-cli (./cli), with the subcommands backup-folder,
# backup-disk and, on Linux, attach-nbd.
#
# Config schema: GoReleaser v2 (v1 configs are rejected since v2.19).
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

builds:
  - id: salvanza-cli
    main: ./cli
    binary: salvanza-cli
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - netbsd
      - openbsd
      - solaris
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm64
      - goos: netbsd
        goarch: arm64
      - goos: openbsd
        goarch: arm64
      - goos: solaris
        goarch: arm64

release:
  # A tag with a prerelease suffix (e.g. v1.2.0-rc.1) publishes as a
  # GitHub prerelease automatically.
  prerelease: auto
  # Text written on the release page by hand is never replaced. The release
  # notes come from build-and-release.yml, which keeps hand-written text too.
  mode: keep-existing

universal_binaries:
  - replace: true

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
# No commit list as release text: build-and-release.yml writes the release
# notes when nobody has written them by hand, and an empty text is how it
# tells that nobody has.
changelog:
  disable: true
