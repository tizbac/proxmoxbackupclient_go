# GoReleaser configuration for the cross-platform CLI archives.
#
# The Windows GUI + service MSIs are *not* built here: they come from
# .github/workflows/build-and-release.yml, which uploads them to the same
# GitHub release this file creates for the tag.
#
# Config schema: GoReleaser v2 (v1 configs are rejected since v2.19).
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

builds:
  - id: windows
    main: ./directorybackup
    binary: pbsdirectorybackup
    goos:
      - windows
    goarch:
      - amd64
  - id: windows_machine
    main: ./machinebackup
    binary: pbsmachinebackup
    goos:
      - windows
    goarch:
      - amd64
  - id: machine
    main: ./machinebackup
    binary: pbsmachinebackup
    goos:
      - linux
      - freebsd
      - netbsd
      - openbsd
      - solaris
    goarch:
      - amd64
  - id: nbd
    main: ./nbd
    binary: pbsnbd
    goos:
      - linux
    goarch:
      - amd64
  - id: directory
    main: ./directorybackup
    binary: directorybackup
    goos:
      - linux
      - freebsd
      - netbsd
      - openbsd
      - solaris
    goarch:
      - amd64

  - id: darwin-amd64
    main: ./directorybackup
    binary: directorybackup
    goos:
      - darwin
    goarch:
      - amd64

  - id: darwin-arm64
    main: ./directorybackup
    binary: directorybackup
    goos:
      - darwin
    goarch:
      - arm64

release:
  # A tag with a prerelease suffix (e.g. v1.2.0-rc.1) publishes as a
  # GitHub prerelease automatically.
  prerelease: auto

universal_binaries:
  - replace: true

archives:
  - formats: [tar.gz]
    allow_different_binary_count: true
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
